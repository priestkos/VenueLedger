name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the Dalamud development distribution
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build VenueLedger
        run: dotnet build VenueLedger.csproj -c Release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem -Recurse -Path bin/Release -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw 'Could not find latest.zip under bin/Release' }
          $staging = Join-Path $env:RUNNER_TEMP 'plugin-package'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $staging)
          $manifest = Get-ChildItem -Path $staging -Filter '*.json' | Select-Object -First 1
          if (-not $manifest) { throw 'No plugin manifest .json found inside latest.zip' }
          $meta = Get-Content -Raw $manifest.FullName | ConvertFrom-Json
          $assemblyVersion = [string]$meta.AssemblyVersion
          Write-Host "Manifest AssemblyVersion: $assemblyVersion"

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $assemblyVersion) {
              throw "Tag $tag (version $tagVersion) does not match manifest AssemblyVersion $assemblyVersion"
            }
            gh release create $tag $zip.FullName --title $tag --generate-notes
            exit 0
          }

          $tag = "v$assemblyVersion"
          $null = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag $zip.FullName --title $tag --generate-notes
